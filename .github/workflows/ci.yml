name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: backend}
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jutant
          POSTGRES_USER: jutant
          POSTGRES_PASSWORD: jutant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jutant" --health-interval 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://jutant:jutant@localhost:5432/jutant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: lint-imports
      - run: pytest tests/core tests/packs packs
      - run: pytest apps api tests/integration

  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
