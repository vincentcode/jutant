# Eval questions for the banking pack (at least one per feature, the pack contract requires).
#
# Answers are checked against the fake bank (packs/banking/adapters/fake.py) and the sample
# documents in evals/documents/. Each question is asked with no feature picked, so routing is
# measured too. Run: python manage.py run_evals
#
# expect_contains phrases are matched ignoring case; keep them to facts any correct answer must
# state, not wording.

- id: q01
  feature: policy_qa
  role: teller
  attributes: {branch: ACC-01}
  question: "What ID do joint account holders need?"
  expect_tool: documents.search
  expect_contains: ["proof of address"]
  expect_citation: true

