[project]
name = "jutant"
version = "0.1.0"
description = "A reusable platform for AI assistants that support an organisation's internal staff."
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "dj-database-url>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "mcp>=1.2",
    "asgiref>=3.8",
    "python-multipart>=0.0.9",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "pytesseract>=0.3",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "import-linter>=2.1",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "api*", "apps*", "providers*", "mcp_servers*", "ingestion*", "packs*", "config*"]

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "packs", "apps", "api"]
python_files = ["test_*.py"]

# --- import-linter: fails the build if a package imports across a forbidden boundary ---

[tool.importlinter]
root_packages = ["core", "api", "apps", "providers", "mcp_servers", "ingestion", "packs", "config"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core is independent"
type = "forbidden"
source_modules = ["core"]
# No tracing library either: the core traces through its Tracer port only.
forbidden_modules = ["django", "fastapi", "api", "apps", "providers", "mcp_servers", "ingestion", "packs", "config",
                     "opentelemetry"]

[[tool.importlinter.contracts]]
name = "Packs depend only on core"
type = "forbidden"
source_modules = ["packs"]
# A pack's tests call its tools through the platform's MCP client, exactly as the platform does.
# Pack servers run through the platform's `serve`, which sets up the platform's tracing; pack
# code itself still cannot import providers.
ignore_imports = [
    "packs.*.tests.** -> providers.mcp.client",
    "mcp_servers.common.server -> providers.tracing",
]
forbidden_modules = ["api", "apps", "providers", "config", "ingestion"]

[[tool.importlinter.contracts]]
name = "FastAPI stays in api"
type = "forbidden"
source_modules = ["core", "apps", "providers", "mcp_servers", "ingestion", "packs", "config"]
forbidden_modules = ["fastapi"]

[[tool.importlinter.contracts]]
name = "API does not touch models"
type = "forbidden"
source_modules = ["api"]
# The API reaches data through the container and adapters, which do use models; only a direct
# import from api/ is forbidden.
allow_indirect_imports = true
forbidden_modules = ["apps.identity.models", "apps.conversation.models", "apps.knowledge.models",
                     "apps.playbooks.models", "apps.audit.models"]

[[tool.importlinter.contracts]]
name = "Apps do not import each other's models"
type = "independence"
modules = ["apps.identity.models", "apps.conversation.models", "apps.knowledge.models",
           "apps.playbooks.models", "apps.audit.models"]
