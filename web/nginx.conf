server {
    listen 80;
    root /usr/share/nginx/html;

    # Look the API up through Docker's DNS on each request (re-checked every 10 s), so a
    # recreated API container is found at its new address instead of answering 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # Every request to the API says who the browser is. X-Forwarded-For is set, not appended,
    # so a client cannot pass a made-up address through; the API uses it for sign-in limits.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    # Streaming answers: no buffering so events reach the browser as they are sent.
    location ~ ^/api/conversations/[^/]+/ask$ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass $api;
    }

    location /admin {
        proxy_pass $api;
    }

    location / {
        try_files $uri /index.html;
    }
}
